<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Rush</title>

    <style>
        body{
            background-color: #f4f1de;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1{
            font-size: 45px;
            margin-bottom: 10px;
        }

        #instructions{
            width: 500px;
            margin: 20px auto;
            padding: 10px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 10px;
        }

        #instructions p{
            margin: 5px;
            font-size: 18px;
        }

        #gameInfo{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px;
        }

        .infoBox{
            width: 130px;
            padding: 10px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 10px;
            font-size: 18px;
        }

        .infoBox div:first-child{
            font-weight: bold;
        }

        #timer, #bestTime, #mistakes{
            font-size: 24px;
            margin-top: 5px;
        }

        #startBtn{
            font-size: 20px;
            padding: 10px 35px;
            margin: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #startBtn:hover{
            background-color: #357abd;
        }

        #gameDiv{
            width: 600px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid black;
            background-color: #fff1b8;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
        }

        .numberBox{
            width: 100px;
            height: 60px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Number Rush</h1>

<div id="instructions">
    <p>Click the numbers in ascending order.</p>
    <p>You have 3 mistakes allowed.</p>
</div>

<div id="gameInfo">

    <div class="infoBox">
        <div>TIME</div>
        <div id="timer">0.00 s</div>
    </div>

    <div class="infoBox">
        <div>BEST</div>
        <div id="bestTime">--</div>
    </div>

    <div class="infoBox">
        <div>MISTAKES</div>
        <div id="mistakes">0 / 3</div>
    </div>

</div>

<button id="startBtn" onclick="startNewGame()">Start</button>

<div id="gameDiv">
</div>

<script>

    // Game variables
    let numbers = [];
    let nextNumber = 0;
    let mistakes = 0;
    let game = false;
    let bestTime = 0;

    // Audio variables
    let audioContext = null;
    let oscillator = null;

    // Timer variables
    let startTime = 0;
    let timerInterval;

    // Returns a random four-digit number
    function getRandomNumber(){
        return Math.floor(Math.random() * 9000) + 1000;
    }

    // Creates ten random numbers for a new game
    function generateNumbers(){
        numbers = [];

        for (let i = 0; i < 10; i++){
            numbers.push(getRandomNumber());
        }
    }

    // Displays the numbers as clickable boxes
    function displayNumbers(){
        let gameDiv = document.getElementById("gameDiv");

        gameDiv.innerHTML = "";

        for (let i = 0; i < numbers.length; i++){
            let numberBox = document.createElement("div");
            let currentNumber = numbers[i];

            numberBox.className = "numberBox";
            numberBox.innerHTML = currentNumber;

            numberBox.onclick = function(){
                checkNumber(currentNumber, numberBox);
            };

            gameDiv.appendChild(numberBox);
        }
    }

    // Finds the smallest number that must be clicked next
    function findMinNumber(){
        nextNumber = numbers[0];

        for (let i = 1; i < numbers.length; i++){
            if (numbers[i] < nextNumber){
                nextNumber = numbers[i];
            }
        }
    }

    // Creates the audio context when the game starts
    function startAudio(){
        audioContext = new AudioContext();
    }

    // Plays the error sound for 0.5 seconds
    function playErrorSound(){

        if (oscillator != null){
            oscillator.stop();
        }

        oscillator = audioContext.createOscillator();

        oscillator.type = "sawtooth";
        oscillator.frequency.value = 150;

        oscillator.connect(audioContext.destination);
        oscillator.start();

        let currentOscillator = oscillator;

        setTimeout(function(){
            currentOscillator.stop();
        }, 500);
    }

    // Starts and updates the game timer
    function startTimer(){

        clearInterval(timerInterval);

        startTime = Date.now();

        timerInterval = setInterval(function(){

            let currentTime = Date.now();
            let time = (currentTime - startTime) / 1000;

            document.getElementById("timer").innerHTML =
                time.toFixed(2) + " s";

        }, 10);
    }

    // Stops the game timer
    function stopTimer(){
        clearInterval(timerInterval);
    }

    // Updates the best time after a successful game
    function updateBestTime(time){

        if (bestTime === 0 || time < bestTime){

            bestTime = time;

            document.getElementById("bestTime").innerHTML =
                bestTime.toFixed(2) + " s";
        }
    }

    // Checks the clicked number and correct or wrong answers
    function checkNumber(number, numberBox){

        // Ignore clicks when the game is not running
        if (!game){
            return;
        }

        // Correct number
        if (number === nextNumber){

            numberBox.style.backgroundColor = "#b7e4c7";

            numbers.splice(numbers.indexOf(number), 1);

            // Check if all numbers have been clicked
            if (numbers.length === 0){

                let finalTime = (Date.now() - startTime) / 1000;

                stopTimer();

                document.getElementById("timer").innerHTML =
                    finalTime.toFixed(2) + " s";

                updateBestTime(finalTime);

                game = false;

                alert("YOU WIN");

            }
            else{

                findMinNumber();

            }

        }
        else{

            // Wrong number
            mistakes++;

            document.getElementById("mistakes").innerHTML =
                mistakes + " / 3";

            numberBox.style.backgroundColor = "red";

            playErrorSound();

            setTimeout(function(){
                numberBox.style.backgroundColor = "#e8f1f8";
            }, 500);

            // End the game after three mistakes
            if (mistakes >= 3){

                let finalTime = (Date.now() - startTime) / 1000;

                stopTimer();

                document.getElementById("timer").innerHTML =
                    finalTime.toFixed(2) + " s";

                game = false;

                setTimeout(function(){
                    alert("GAME OVER");
                }, 500);

            }
        }
    }

    // Resets the game and starts a new round
    function startNewGame(){

        mistakes = 0;
        game = true;

        document.getElementById("mistakes").innerHTML = "0 / 3";
        document.getElementById("timer").innerHTML = "0.00 s";

        startAudio();

        generateNumbers();
        displayNumbers();
        findMinNumber();

        startTimer();
    }

</script>

</body>
</html>
