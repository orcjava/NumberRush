<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Rush</title>

    <style>
        body{
            background-color: #f4f1de;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1{
            font-size: 45px;
            margin-bottom: 10px;
        }

        #instructions{
            width: 500px;
            margin: 20px auto;
            padding: 10px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 10px;
        }

        #instructions p{
            margin: 5px;
            font-size: 18px;
        }

        #gameInfo{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px;
        }

        .infoBox{
            width: 130px;
            padding: 10px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 10px;
            font-size: 18px;
        }

        .infoBox div:first-child{
            font-weight: bold;
        }

        #timer, #bestTime{
            font-size: 24px;
            margin-top: 5px;
        }

        #startBtn{
            font-size: 20px;
            padding: 10px 35px;
            margin: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #startBtn:hover{
            background-color: #357abd;
        }

        #gameDiv{
            width: 600px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid black;
            background-color: white;
        }
    </style>
</head>

<body>

<h1>Number Rush</h1>

<div id="instructions">
    <p>Click the numbers in ascending order.</p>
    <p>You have 3 mistakes allowed.</p>
</div>

<div id="gameInfo">

    <div class="infoBox">
        <div>TIME</div>
        <div id="timer">0.00 s</div>
    </div>

    <div class="infoBox">
        <div>BEST</div>
        <div id="bestTime">--</div>
    </div>

</div>

<button id="startBtn">Start</button>

<div id="gameDiv">
</div>

<script>

    let numbers = [];

    function getRandomNumber(){
        return Math.floor(Math.random() * 9000) + 1000;
    }

    function generateNumbers(){
        numbers = [];

        for (let i = 0; i < 10; i++){
            numbers.push(getRandomNumber());
        }

        console.log(numbers);
    }
    generateNumbers()

</script>

</body>
</html>
