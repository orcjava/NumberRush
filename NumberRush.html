<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Rush</title>

    <style>
        body{
            background-color: #f4f1de;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1{
            font-size: 45px;
            margin-bottom: 10px;
        }

        #instructions{
            width: 500px;
            margin: 20px auto;
            padding: 10px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 10px;
        }

        #instructions p{
            margin: 5px;
            font-size: 18px;
        }

        #gameInfo{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px;
        }

        .infoBox{
            width: 130px;
            padding: 10px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 10px;
            font-size: 18px;
        }

        .infoBox div:first-child{
            font-weight: bold;
        }

        #timer, #bestTime, #mistakes{
            font-size: 24px;
            margin-top: 5px;
        }

        #startBtn{
            font-size: 20px;
            padding: 10px 35px;
            margin: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #startBtn:hover{
            background-color: #357abd;
        }

        #gameDiv{
            width: 600px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid black;
            background-color: #fff1b8;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            box-sizing: border-box;
        }

        .numberBox{
            width: 100px;
            height: 60px;
            background-color: #e8f1f8;
            border: 1px solid #c5dce8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Number Rush</h1>

<div id="instructions">
    <p>Click the numbers in ascending order.</p>
    <p>You have 3 mistakes allowed.</p>
</div>

<div id="gameInfo">

    <div class="infoBox">
        <div>TIME</div>
        <div id="timer">0.00 s</div>
    </div>

    <div class="infoBox">
        <div>BEST</div>
        <div id="bestTime">--</div>
    </div>

    <div class="infoBox">
        <div>MISTAKES</div>
        <div id="mistakes">0 / 3</div>
    </div>

</div>

<button id="startBtn" onclick="startNewGame()">Start</button>

<div id="gameDiv">
</div>

<script>

    let numbers = [];
    let nextNumber = 0;
    let mistakes = 0;
    let game = false;

    function getRandomNumber(){
        return Math.floor(Math.random() * 9000) + 1000;
    }

    function generateNumbers(){
        numbers = [];

        for (let i = 0; i < 10; i++){
            numbers.push(getRandomNumber());
        }

        console.log(numbers);
    }

    function displayNumbers(){
        let gameDiv = document.getElementById("gameDiv");

        gameDiv.innerHTML = "";

        for (let i = 0; i < numbers.length; i++){
            let numberBox = document.createElement("div");
            let currentNumber = numbers[i];

            numberBox.className = "numberBox";
            numberBox.innerHTML = currentNumber;

            numberBox.onclick = function(){
                checkNumber(currentNumber, numberBox);
            };

            gameDiv.appendChild(numberBox);
        }
    }

    function findMinNumber(){
        nextNumber = numbers[0];

        for (let i = 1; i < numbers.length; i++){
            if (numbers[i] < nextNumber){
                nextNumber = numbers[i];
            }
        }

        console.log("Next number:", nextNumber);
    }

    function checkNumber(number, numberBox){

        if (!game){
            return;
        }

        if (number === nextNumber){

            numberBox.style.backgroundColor = "#b7e4c7";

            numbers.splice(numbers.indexOf(number), 1);

            findMinNumber();

            console.log("Correct!");
            console.log("Next number:", nextNumber);

        }
        else{

            mistakes++;

            document.getElementById("mistakes").innerHTML = mistakes + " / 3";

            numberBox.style.backgroundColor = "red";

            setTimeout(function(){
                numberBox.style.backgroundColor = "#e8f1f8";
            }, 500);

            console.log("Wrong!");
            console.log("Mistakes:", mistakes);

            if (mistakes >= 3){

                setTimeout(function(){
                    game = false;
                    alert("GAME OVER");
                }, 500);

            }
        }
    }

    function startNewGame(){

        mistakes = 0;
        game = true;

        document.getElementById("mistakes").innerHTML = "0 / 3";

        generateNumbers();
        displayNumbers();
        findMinNumber();
    }

</script>

</body>
</html>
