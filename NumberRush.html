<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Rush</title>

    <style>
        body{
            background-color: #f4f1de;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1{
            font-size: 45px;
            margin-bottom: 10px;
        }

        .instructions{
            font-size: 18px;
            margin: 5px;
        }

        #gameDiv{
            width: 600px;
            height: 400px;
            margin: 20px auto;
            border: 2px solid black;
            background-color: white;
        }

        #startBtn{
            font-size: 20px;
            padding: 10px 35px;
            margin: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #startBtn:hover{
            background-color: #357abd;
        }
    </style>
</head>

<body>

<h1>Number Rush</h1>

<p class="instructions">
    Click the numbers in ascending order.
</p>

<p class="instructions">
    You have 3 mistakes allowed.
</p>

<button id="startBtn">Start</button>

<div id="gameDiv">
</div>

</script>

</html>
